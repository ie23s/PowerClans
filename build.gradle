plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    id 'org.sonarqube' version '5.0.0.4638'
    id 'com.gradleup.shadow' version '8.3.6'
}

// ─── Versioning ───────────────────────────────────────────────────────────────

def env = System.getenv()
def buildNumber = env.BUILD_NUMBER ?: 'local'

def branchRaw =
        env.BRANCH_NAME ?:
                env.GIT_LOCAL_BRANCH ?:
                        env.GIT_BRANCH ?:
                                env.gitlabBranch ?:
                                        env.gitlabSourceBranch ?:
                                                ''

def branch = branchRaw.trim().toLowerCase()

def isMain =
        branch == 'main' ||
                branch == 'master' ||
                branch.endsWith('/main') ||
                branch.endsWith('/master')

def isSnapshot =
        branch == 'snapshot' ||
                branch.endsWith('/snapshot')

def channel = isMain ? 'RELEASE' : (isSnapshot ? 'SNAPSHOT' : 'BUILD')
version = "0.4.${buildNumber}-${channel}"
group = 'com.ie23s.bukkit.plugin'

// ─── Java ─────────────────────────────────────────────────────────────────────

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ─── Repositories ─────────────────────────────────────────────────────────────

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven { url = 'https://repo.essentialsx.net/releases/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

// ─── Dependencies ─────────────────────────────────────────────────────────────

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly('net.essentialsx:EssentialsX:2.21.2') {
        exclude group: 'io.papermc.paper', module: 'paper-api'
    }
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.15'

    testImplementation 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
    testImplementation 'com.github.MilkBowl:VaultAPI:1.7.1'
    testImplementation 'com.sk89q.worldguard:worldguard-bukkit:7.0.15'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.xerial:sqlite-jdbc:3.47.1.0'

    implementation 'com.zaxxer:HikariCP:5.1.0'
}

// ─── Tests ────────────────────────────────────────────────────────────────────

test {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true  // це обов'язково
    }
}
// ─── API jar ──────────────────────────────────────────────────────────────────

tasks.register('apiJar', Jar) {
    group = 'build'
    description = 'Produces a jar containing only the public API.'
    archiveClassifier = 'api'
    dependsOn classes
    from(sourceSets.main.output) {
        include '**/api/**'
    }
}

// ─── Resources ────────────────────────────────────────────────────────────────

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// ─── Shadow ───────────────────────────────────────────────────────────────────

shadowJar {
    archiveClassifier = ''
}

jar.finalizedBy shadowJar

// ─── SonarQube ────────────────────────────────────────────────────────────────

sonar {
    properties {
        property 'sonar.gradle.skipCompile', 'true'
    }
}

// ─── Publishing ───────────────────────────────────────────────────────────────

publishing {
    publications {
        //noinspection GroovyAssignabilityCheck
        mavenJava(MavenPublication) {
            //noinspection GroovyAssignabilityCheck
            from components.java
            //noinspection GroovyAssignabilityCheck
            artifact apiJar
        }
    }

    repositories {
        if (channel == 'RELEASE' || channel == 'SNAPSHOT') {
            maven {
                url = uri(channel == 'SNAPSHOT'
                        ? 'https://maven.ie23s.com/snapshots'
                        : 'https://maven.ie23s.com/releases')
                credentials {
                    username = env.reposiliteUsername ?: ''
                    password = env.reposilitePassword ?: ''
                }
            }
        }
    }
}
